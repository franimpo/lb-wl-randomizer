<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141a">
    <title>¿Qué veo hoy? — Letterboxd Randomizer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Miranda+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="wrap">
        <header>
            <div class="eyebrow">FRANIMPO <span>●</span> LETTERBOXD</div>
            <h1>¿Qué veo <em>hoy?</em></h1>
        </header>
        <section class="toolbar">
            <div><label for="max-runtime">Duración máxima</label><select id="max-runtime">
                    <option value="0">Cualquiera</option>
                    <option value="90">Hasta 1 h 30 min</option>
                    <option value="120">Hasta 2 h</option>
                    <option value="150">Hasta 2 h 30 min</option>
                </select></div><label class="check"><input id="no-repeat" type="checkbox" checked> Evitar repeticiones
                durante la sesión</label>
        </section>
        <section class="result" aria-live="polite">
            <div class="poster"><img id="poster" alt="Póster de la película" hidden>
                <div id="placeholder">🎬</div>
            </div>
            <div class="details">
                <div class="mini">TU PRÓXIMA PELÍCULA</div>
                <h2 id="movie-title">¿Listo para elegir?</h2>
                <div id="movie-meta">Presioná el botón para sortear una película.</div>
                <div class="actions"><button id="pick" class="primary">↻ Elegir película</button><a id="letterboxd-link"
                        target="_blank" rel="noopener" hidden>Ver en Letterboxd ↗</a></div>
            </div>
        </section>
        <div class="status" id="status">Cargando watchlist...</div>
        <footer>Sincronización programada cada 24 horas · <a href="https://letterboxd.com/franimpo/watchlist/"
                target="_blank" rel="noopener">Watchlist original ↗</a><span> · <a href="data/watchlist.csv"
                    download>CSV ↧</a></span></footer>
    </main>
    <script src="app.js"></script>
</body>

</html>
