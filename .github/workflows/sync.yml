name: Daily Letterboxd sync
on:
  schedule:
    - cron: '0 8 * * *' # 05:00 Argentina
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: letterboxd-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch Letterboxd watchlist
        run: python scripts/sync.py
        env:
          LETTERBOXD_USERNAME: franimpo
      - name: Enrich with TMDB durations and posters
        run: python scripts/enrich_tmdb.py
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.csv data/watchlist.json data/tmdb_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Letterboxd watchlist and TMDB details"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
